
name: Update Top Language

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install @octokit/rest

      - run: node scripts/top-language.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: Official-TiredRice-ch

      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git commit -am "chore: update top language" || echo "No changes"
          git push
